services:
  ms-data-collector:
    build: ./data/data_collector
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - ms-ai
      - mongo
    environment:
      - ai_URL=http://ms-ai:5000
      - RIOT_API_KEY=${RIOT_API_KEY}
      - RIOT_ACCOUNT_URL=https://europe.api.riotgames.com/riot/account/v1/accounts/by-riot-id/
      - RIOT_MATCHES_URL=https://europe.api.riotgames.com/lol/match/v5/matches/
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=match_data
  ms-core:
    build: ./ms-core
    container_name: ms-core
    ports:
      - "8181:8181"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-core:5432/ms_core
      SPRING_DATASOURCE_USERNAME: core_user
      SPRING_DATASOURCE_PASSWORD: core_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres-core

  ms-ai:
    build: ./ai
    ports:
      - "5000:5000"
    restart: "no"
    env_file:
      - .env
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=match_data
      - MONGO_RECOMS_COLLECTION=recommendations

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  postgres-core:
    image: postgres:16
    container_name: postgres-ms-core
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms_core
      POSTGRES_USER: core_user
      POSTGRES_PASSWORD: core_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
  ms-gemma:
    build:
      context: ./ms-gemma
      dockerfile: Dockerfile
    container_name: ms-gemma
    ports:
      - "8000:8000"
    volumes:
      - ./ms-gemma/src:/app/src
      - C:/Users/Usuario/.cache/huggingface/hub:/root/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  ms-fe:
    build: ./ms-FE
    container_name: ms-fe
    ports:
      - "5173:80" # Map host 5173 to container 80 (nginx)
    depends_on:
      - ms-core

volumes:
  mongo_data:
  postgres_core_data:
